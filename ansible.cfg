# Конфигурация Ansible для лаборатории CyberFleet.
# Если Ansible пишет "config file = None" (папка смонтирована как world-writable),
# задайте путь явно: export ANSIBLE_CONFIG=/ansible/ansible.cfg

[defaults]
inventory = ./hosts.ini
remote_user = ansible
private_key_file = /root/.ssh/id_ed25519
# Лаборатория: контейнеры пересоздаются, host-ключи меняются — проверку отключаем
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
forks = 10
timeout = 15

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
