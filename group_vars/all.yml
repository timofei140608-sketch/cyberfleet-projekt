# Общие переменные CyberFleet 2026 (применяются ко всем узлам инвентаря)

# Каталоги состояния на hq-controller (том hq_data)
cf_state_dir: /var/lib/cyberfleet
cf_log_dir: /var/log/cyberfleet
cf_web_root: /var/www/html

# Сетевая зона узла — по группам инвентаря
cf_zone: >-
  {{ 'mgmt_net' if 'mgmt' in group_names
     else 'corp_net' if 'corp' in group_names
     else 'dmz_iot' if 'dmz' in group_names
     else 'mgmt_net + corp_net + dmz_iot' }}

# Разрешённые слушающие порты (всё остальное — тревога в CMDB и закрывается в 07)
allowed_ports: [22]

# Osquery есть везде, кроме Alpine (там лёгкий скрипт телеметрии)
use_osquery: "{{ ansible_facts['os_family'] | default('') != 'Alpine' }}"

# Если нужен HTTP-прокси для установки пакетов (корпоративная сеть):
#   proxy_env: {http_proxy: "http://proxy:3128", https_proxy: "http://proxy:3128"}
proxy_env: {}

# Критичные файлы для FIM (контроль целостности)
fim_files:
  - /etc/passwd
  - /etc/shadow
  - /etc/ssh/sshd_config
  - /etc/sudoers

