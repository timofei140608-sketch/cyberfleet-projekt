# Инвентарь CyberFleet 2026
# Управляющий узел hq-controller в инвентарь не входит: Ansible запускается на нём самом.
# ansible_host = IP из IP-плана (не зависит от DNS Docker).

[workstations]
ws-dev-01     ansible_host=172.30.20.11
ws-fin-01     ansible_host=172.30.20.12

[servers]
srv-app-01    ansible_host=172.30.20.13

[kiosks]
kiosk-lobby   ansible_host=172.30.30.11

[iot]
iot-sensor-1  ansible_host=172.30.30.12
iot-cam-1     ansible_host=172.30.30.13

[vault]
backup-vault  ansible_host=172.30.10.20

# --- Объединения по сетевым зонам (пригодятся на неделях 2-4) ---
[corp:children]
workstations
servers

[dmz:children]
kiosks
iot

[mgmt:children]
vault

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/root/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
